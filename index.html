<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>ToDoList</title>
  </head>
  <body>
    <div class="window">
      <div class="main-item">
        <h1>To Do List</h1>
        <div class="group">
          <input
            autofocus
            value=""
            placeholder="New Task Text"
            class="input"
            type="text"
          />
          <button class="add">Add</button>
        </div>
        <input placeholder="Search Task" class="search" type="text" />
        <div class="group">
          <div class="counter">Total Tasks: 0</div>
          <button class="deleteAll">DELETE ALL</button>
        </div>
        <ul class="tasks"></ul>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
